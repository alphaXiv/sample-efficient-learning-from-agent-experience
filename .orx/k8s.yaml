apiVersion: batch/v1
kind: Job
metadata:
  name: experience-distill-{{ORX_RUN}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          command: ["bash", "-c", "eval \"$ORX_SCRIPT\""]
          resources:
            requests:
              nvidia.com/gpu: "4"
              cpu: "24"
              memory: "96Gi"
            limits:
              nvidia.com/gpu: "4"
              cpu: "24"
              memory: "96Gi"
