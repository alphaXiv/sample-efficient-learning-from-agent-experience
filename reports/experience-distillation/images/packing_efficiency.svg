<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">Packing reduced optimization work</title><desc id="desc">Instances, steps, and training seconds for unpacked and lossless packed distillation.</desc>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<style>text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#202124}.small{font-size:13px}.label{font-size:15px}.title{font-size:22px;font-weight:700}.value{font-size:14px;font-weight:700}</style>
<text x="70" y="36" class="title">Packing reduced optimization work</text>
<text x="70" y="61" class="small">Absolute measurements; unpacked and packed preserve the same 790 supervised target tokens.</text>
<text x="20" y="80" class="label">Training instances</text>
<rect x="210" y="90" width="500.0" height="25" rx="4" fill="#2a9d8f"/>
<text x="700.0" y="108" text-anchor="end" class="value" style="fill:#ffffff">196</text>
<text x="200" y="108" text-anchor="end" class="small">Unpacked</text>
<rect x="210" y="128" width="181.1" height="25" rx="4" fill="#7768ae"/>
<text x="400.1" y="146" text-anchor="start" class="value">71</text>
<text x="200" y="146" text-anchor="end" class="small">Packed</text>
<text x="20" y="195" class="label">Optimization steps</text>
<rect x="210" y="205" width="500.0" height="25" rx="4" fill="#2a9d8f"/>
<text x="700.0" y="223" text-anchor="end" class="value" style="fill:#ffffff">125</text>
<text x="200" y="223" text-anchor="end" class="small">Unpacked</text>
<rect x="210" y="243" width="180.0" height="25" rx="4" fill="#7768ae"/>
<text x="399.0" y="261" text-anchor="start" class="value">45</text>
<text x="200" y="261" text-anchor="end" class="small">Packed</text>
<text x="20" y="310" class="label">Training time</text>
<rect x="210" y="320" width="500.0" height="25" rx="4" fill="#2a9d8f"/>
<text x="700.0" y="338" text-anchor="end" class="value" style="fill:#ffffff">8.47 s</text>
<text x="200" y="338" text-anchor="end" class="small">Unpacked</text>
<rect x="210" y="358" width="377.2" height="25" rx="4" fill="#7768ae"/>
<text x="596.2" y="376" text-anchor="start" class="value">6.39 s</text>
<text x="200" y="376" text-anchor="end" class="small">Packed</text></svg>